name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Most students are on Windows, so Windows is a first-class CI target rather
    # than an afterthought — encoding and terminal bugs only show up there.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q
        env:
          PYTHONUTF8: "1"

      - name: Example project still compiles
        run: uv run python scripts/make_example.py

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run pyright
        continue-on-error: true
