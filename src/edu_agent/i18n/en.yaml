  spec_missing: "04_agent_spec.md is missing. Run 'edu-agent compile' first."
  spec_stale: "Input documents changed. Run 'edu-agent compile' again."
  no_provider: "Cannot reach the AI model. Run 'edu-agent doctor'."
  invalid_choice: "Enter a number from 1 to {max}."
  file_error: "Cannot read file: {path}"
