  web_port_busy: "Port {port} is not available — another program seems to be using it."
  web_nothing: "Nothing was said, so nothing was saved."

test:
  running: "Talking to simulated learners… ({done}/{total})"
  evaluating: "Evaluating…"
  title: "Educational implementation-fidelity evaluation"
  overall: "Overall"
  pass_: "PASS"
  fail: "FAIL"
  calibration_warn: "Judge scores are provisional until calibrated against human ratings."
  limitation: |
    These results come from simulated learners.
    They show whether your design intent is executed — not evidence of learning gains.

improve:
  found: "Found {n} improvement proposals."
  none: "Nothing to fix — the evaluation already meets your thresholds."
  which: "Which changes should be applied?"
  all: "Apply all"
  nothing: "Apply none"
  applied: "Applied {n}. Run 'edu-agent test' to verify."
  verifying: "Re-verifying the applied changes…"
  regression: "Regression detected: {what}. Rolling back."
  improved: "Improved: {before} → {after}"
  no_improvement: "No improvement ({before} → {after}). Rolling back."
  needs_human: "This change edits a design principle, so you must review it yourself."
  rolled_back: "Rolled back to version {version}."

errors:
  continuing_without_model: "Continuing without the model. Run this again once the key is in place to pick up where it left off."
  no_key_yet: "No key yet? Use --mock for a fake model, or --no-llm to work on the documents only."
  no_project: "No project found. Run 'edu-agent init' first."
