# English message catalogue. Missing keys fall back to the Korean catalogue.
app:
  description: "A harness for designing, running and verifying educational AI agents"
  tagline: "Turn design principles into agent behaviour, and into checkable criteria."

common:
  "yes": "Yes"
  "no": "No"
  unknown: "Not sure / recommend for me"
  later: "Later (save and exit)"
  confirm: "Confirm"
  edit: "Edit"
  add: "Add more"
  back: "Back"
  saved: "Saved: {path}"
  cancelled: "Cancelled. What you entered so far has been saved."
  why_ask: "Why this question?"
  recommended: "recommended"
  next_step: "Next step"
  none: "none"

ui:
  enter_for: "Press Enter for: {default}"
  multiline: "You can write several lines. Press Enter twice on a blank line when done."
  multi_help: "Pick several with commas (e.g. 1,3,5). 'all' for everything, Enter for none."
  all_word: "all"
  answer_needed: "Please type an answer."
  pick_one: "Please pick at least one."
  number_needed: "Please type a number."
  minimum: "Please type {minimum} or more."
  try_command: "Try running [bold]{command}[/bold]."
  here: "You are in: {path}"

status:
  title: "Project status"
  doc_missing: "missing"
  draft: "draft"
  confirmed: "confirmed"
  needs_sync: "body edited — needs sync"
  compiled: "compiled"
  stale: "inputs changed — recompile"
  hint_review: "edu-agent review {doc}"
  hint_compile: "edu-agent compile"
  hint_run: "edu-agent run"
  hint_test: "edu-agent test"
  hint_init: "edu-agent init"

doctor:
  title: "Environment check"
  python_ok: "Python {version}"
  python_old: "Python 3.12+ is required (found {version})"
  project_found: "Project: {name}"
  project_missing: "No project here. Run 'edu-agent init' to create one."
  env_file: ".env file"
  key_missing: "No API key configured"
  key_ok: "API key found (…{tail})"
  base_url: "Server: {url}"
  model: "Model: {model}"
  reach_ok: "Model reachable ({ms}ms)"
  reach_fail: "Could not reach the model: {error}"
  no_key_hint: |
    No API key found. Do one of:
      1) Paste the key your instructor gave you into .env in the project folder:
         EDU_AGENT_API_KEY=...
      2) Work on documents without a model by adding --no-llm
  sandbox_title: "Code execution"
  sandbox_container: "Running inside an isolated container (docker)."
  sandbox_partial: "Isolation is partial. Learner code runs on this machine with time/memory limits and network blocking only."
  sandbox_off: "Code execution is turned off."
  all_ok: "All good. Start with 'edu-agent init' or 'edu-agent status'."

init:
  welcome: "Creating a new educational AI agent project."
  ask_name: "Project name (lowercase, hyphens)"
  ask_title: "In one sentence, what do you want to build?"
  created: "Project created: {path}"
  next: "Now run 'edu-agent review 01' to start the educational design."
  exists: "A project already exists: {path}"

review:
  step: "STEP {n} / {total}"
  summary_title: "Here is what I understood"
  confirm_question: "Is this correct?"
  missing_title: "Still empty"
  drift_detected: "The body was edited by hand. Update the structured data?"
  drift_keep: "Keep the body, leave the structure as is"
  ok: "{doc} confirmed"
  no_llm: "Running without AI help (--no-llm). You will enter structure yourself."

principles:
  title: "Educational design principles"
  subtitle: "What you decide here becomes the agent's actual behaviour rules and its checks."

  theories:
    step: "[bold]1/5 · Theories and teaching strategies[/bold]"
    lead: "Choose what this agent's design leans on."
    question: "Which theories or teaching strategies are you applying?"
    hint: "This becomes the opening section of the document and the basis of each principle."
    add: "Add your own {n} (Enter to skip)"
    empty: "You can leave this empty, but a principle with no stated basis is hard to review later."
    scaffolding: "Scaffolding and fading"
    srl: "Self-regulated learning (SRL) — plan, monitor, reflect"
    socratic: "Socratic questioning"
    cognitive_load: "Cognitive load theory"
    formative: "Formative assessment and feedback (directive + metacognitive)"
    constructivism: "Constructivism / discovery learning"
    misconception: "Misconception diagnosis and conceptual change"
    collaborative: "Collaborative learning · peer explanation"

  answer:
    step: "[bold]2/5 · Answer-giving policy[/bold]"
    question: "May the AI give the learner the answer directly?"
    hint: "This sets the default for the scaffolding ladder and the answer gate."
    never: "Never"
    conditional: "Only under certain conditions  ({recommended})"
    allowed: "Yes"
    never_warning: "You chose 'never give the answer'."
    never_note: "The research treats both as failures: giving the answer too early, and withholding it after the learner has genuinely tried. The second one leaves the learner stuck with nowhere to go."
    reconsider: "Switch to giving it conditionally?"
    when_question: "Then *when* may it give the answer?"
    when_hint: "This condition is checked at run time; before it holds, answers are blocked."
    when_attempts_3: "After 3 or more attempts of their own"
    when_attempts_2: "After 2 or more attempts of their own"
    when_attempts_or_stuck: "After 3 attempts, or when stuck for 2 turns"
    when_reasoning: "After stating their own thinking and trying twice"
    custom: "Write my own"
    custom_vars: "Available: attempts, stuck_turns, help_requests, reasoning_shown"
    custom_example: "e.g. attempts >= 4  ·  reasoning_shown == true and stuck_turns >= 1"
    custom_prompt: "Enter the condition"

  library:
    step: "[bold]3/5 · Design principle library[/bold]"
    lead: "Each of these cites its source. Pick some, then edit them freely."
    question: "Which principles would you like to use?"
    hint: "Every principle carries its references; you can check them in the document later."
    exhausted: "You have already imported every principle in the library."
    imported: "Imported {n} principle(s). You will confirm them one by one next."
    why_it_matters: "Why it matters:"
    sources: "Sources:"

  own:
    step: "[bold]4/5 · Your own design principles[/bold]"
    lead: "Bring in principles you derived from the literature. The original text is kept verbatim."
    question: "Do you have design principles of your own?"
    hint: "From a file, the original is preserved and you can edit and re-import it."
    from_file: "Load from a Markdown file"
    paste: "Paste them here"
    none: "None"
    paste_prompt: "Enter your design principles (one per line)"
    path_prompt: "File path (e.g. principles.md, Enter to cancel)"
    file_read: "Read {name} ({lines} lines)."
    nothing_found: "I could not find anything in this document that reads as a design principle."
    nothing_found_hint: "The original is kept in the document either way. Headings (##) or list items (-) are read best."
    read_count: "Read {n} principle(s)."
    and_more: "… and {n} more"
    confirm_structuring: "Structure these?"
    declined: "Saved the original text only. Edit the file and run this again."
    no_llm: "Running without AI help (--no-llm). Saving the original text and skipping structuring."
    no_llm_hint: "Set an API key later and run 'edu-agent review 02' again."
    structuring: "Structuring: {statement}"
    structuring_failed: "Could not structure this principle automatically. Write the rules yourself in the document."
    capped: "Structured {shown} of {total}. The rest stay in the original text — run this again to continue."

  confirm:
    step: "[bold]5/5 · Confirm the rules[/bold]"
    lead: "Each principle has become 'in this situation, do this and not that'. Check that it matches your intent. Unconfirmed principles are not compiled."
    question: "Do these rules match your intent?"
    accept: "Yes, they do"
    drop: "Drop this principle"
    edit: "Let me reword the description"
    edit_prompt: "Write the description again"
    accepted: "{id} confirmed"
    dropped: "Dropped {id}."

  render:
    no_description: "(no description)"
    always: "always"
    when: "[bold]When:[/bold] {triggers}"
    then: "[bold]Then:[/bold]"
    step_line: "  level {level} → {label}{condition}"
    actions: "[bold]Actions:[/bold] {actions}"
    hard: "[bold]Enforced at run time:[/bold]"
    soft: "[bold]Written into the prompt:[/bold]"
    no_rules: "[yellow]No executable rules. This principle will not reach the agent's behaviour.[/yellow]"

  cross_cutting:
    lead: "Finally, one sentence for each of four stances. Leave any empty to use the default."
    agency: "Learner agency: what do you leave to the learner?"
    scaffolding: "Scaffolding: how should help be adjusted?"
    feedback: "Feedback: what counts as good feedback here?"
    reflection: "Reflection: when and on what should the learner look back?"

  escalation:
    lead: "What the agent must not handle alone is part of the design too."
    question: "When should the agent hand the learner to a teacher?"
    hint: "This sentence becomes the agent's safety policy in the system prompt."
    custom_prompt: "In one sentence, when should it hand over?"
    no_progress_label: "When repeated help produces no progress"
    no_progress: "If repeated help produces no progress, tell the learner to ask their teacher."
    distress_label: "When the learner seems distressed"
    distress: "If the learner shows strong frustration or anxiety, tell them to reach their teacher rather than continuing."
    both_label: "Both 1 and 2 ({recommended})"
    both: "If repeated help produces no progress, or the learner seems distressed, tell them to ask their teacher."

  summary:
    heading: "[bold]Design principles[/bold] {confirmed} confirmed / {total} total"
    line: "  {mark} {id} {title} — {rules} rule(s), {gates} enforced at run time"
    answer_policy: "[bold]Answer-giving[/bold] {policy}"
    criteria: "[bold]Criteria[/bold] {n}"

