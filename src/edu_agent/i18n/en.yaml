  running: "Building the agent specification…"
  blocked: "Some things must be fixed first."
  conflict: "Conflicting design principles"
  done: "Created 04_agent_spec.md"
  traceability: "Traceability"
  gates_made: "Created {n} policy gates."

run:
  banner: "{name} · starting the conversation. Type /quit to exit."
  privacy: "This conversation is recorded only in .edu-agent/ on this computer."
