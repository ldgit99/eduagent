  edit: "수정"
  add: "내용 추가"
  back: "이전"
  saved: "저장했습니다: {path}"
  cancelled: "취소했습니다. 지금까지 입력한 내용은 저장되었습니다."
  why_ask: "왜 묻나요?"
  recommended: "권장"
  next_step: "다음 할 일"
  none: "없음"

status:
