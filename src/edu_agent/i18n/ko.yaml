  sandbox_off: "코드 실행이 꺼져 있습니다."
  all_ok: "모두 정상입니다. 'edu-agent init' 또는 'edu-agent status'로 시작하세요."

init:
  welcome: "새 교육용 AI 에이전트 프로젝트를 만듭니다."
  ask_name: "프로젝트 이름 (영문 소문자, 하이픈)"
  ask_title: "무엇을 만들고 싶은지 한 문장으로 적어 주세요"
  created: "프로젝트를 만들었습니다: {path}"
