# 한국어 메시지 카탈로그
app:
  description: "교육용 AI 에이전트를 설계·실행·검증하는 하네스"
  tagline: "설계원리를 에이전트의 행동으로, 그리고 검증 가능한 기준으로."

common:
  "yes": "예"
  "no": "아니오"
  unknown: "잘 모르겠음 / 추천해 주세요"
  later: "나중에 (저장 후 종료)"
  confirm: "확인"
  edit: "수정"
  add: "내용 추가"
  back: "이전"
  saved: "저장했습니다: {path}"
  cancelled: "취소했습니다. 지금까지 입력한 내용은 저장되었습니다."
  why_ask: "왜 묻나요?"
  recommended: "권장"
  next_step: "다음 할 일"
  none: "없음"

# 질문 하나하나에 붙는 안내문. 화면에 가장 자주 나오는 문장들이라
