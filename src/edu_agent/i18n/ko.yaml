ui:
  enter_for: "엔터만 누르면: {default}"
  multiline: "여러 줄로 쓸 수 있습니다. 다 쓰면 빈 줄에서 엔터를 두 번 누르세요."
  multi_help: "쉼표로 여러 개를 고를 수 있습니다 (예: 1,3,5). 전체는 'all', 없으면 엔터."
  all_word: "전체"
  answer_needed: "답을 입력해 주세요."
  pick_one: "하나 이상 선택해 주세요."
  number_needed: "숫자를 입력해 주세요."
  minimum: "{minimum} 이상의 숫자를 입력해 주세요."
  try_command: "[bold]{command}[/bold] 을(를) 실행해 보세요."
  here: "현재 위치: {path}"

status:
