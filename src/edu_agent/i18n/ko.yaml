  hint_compile: "edu-agent compile"
  hint_run: "edu-agent run"
  hint_test: "edu-agent test"
  hint_init: "edu-agent init"

doctor:
  title: "환경 점검"
  python_ok: "Python {version}"
  python_old: "Python 3.12 이상이 필요합니다 (현재 {version})"
  project_found: "프로젝트: {name}"
  project_missing: "이 폴더에는 프로젝트가 없습니다. 'edu-agent init'으로 만드세요."
  env_file: ".env 파일"
  key_missing: "API 키가 설정되지 않았습니다"
  key_ok: "API 키 확인됨 (…{tail})"
  base_url: "서버 주소: {url}"
  model: "모델: {model}"
  reach_ok: "모델 응답 확인됨 ({ms}ms)"
