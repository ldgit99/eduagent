      1) 교수자가 배포한 키를 프로젝트 폴더의 .env 파일에 붙여넣기
         EDU_AGENT_API_KEY=...
      2) 키 없이 문서 작업만 하려면 명령에 --no-llm 을 붙이기
  sandbox_title: "코드 실행 환경"
  sandbox_container: "컨테이너로 격리해 실행합니다 (docker)."
