[project]
name = "edu-agent-harness"
version = "0.3.0"
description = "Pedagogy-Aware Educational AI Agent Engineering Harness — design, compile, build, simulate and evaluate educational AI agents from structured Markdown specifications."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "edu-agent-harness contributors" }]
keywords = ["education", "ai-agent", "instructional-design", "llm", "evaluation", "harness"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Upper bounds on everything. Without them, two people running the same install
# command a month apart get different software, and the one who installed later
# is the one who finds out. The caps are the next major after what is in
# uv.lock, except typer, which is pre-1.0 and can break on a minor.
#
# `typer` is the one to watch: it vendors Click as `typer._click`, and `run_cli`
# depends on `standalone_mode=False` plus Click's duck-typed `show()`.
dependencies = [
  "typer>=0.15,<1.0",
  "rich>=13.9,<16",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
  "jinja2>=3.1,<4",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
# LLM providers are optional extras so that the core CLI stays light.
#
# These have all crossed a major since the lower bounds were written (openai is
# on 3.x, anthropic on 1.x) and kept working, because `providers/` is a thin
# compatibility layer. The lower bounds are therefore older than anything that
# has actually been tested; the upper bounds are what stop the next major from
# arriving unannounced in the middle of someone's term.
openai = ["openai>=1.50,<4"]
anthropic = ["anthropic>=0.40,<2"]
gemini = ["google-genai>=1.0,<3"]
all-providers = ["openai>=1.50,<4", "anthropic>=0.40,<2", "google-genai>=1.0,<3"]

[project.scripts]
# Not ``cli:app``. Typer's app runs in standalone mode, where an abort is a
# traceback; ``run_cli`` is what turns every failure into a sentence and an exit
# code. Pointing the console script past it made that handling dead code for
# everyone who installed the harness (tests call ``run_cli`` directly, so they
# never noticed).
edu-agent = "edu_agent.cli:run_cli"

[project.urls]
Homepage = "https://github.com/ldgit99/eduagent"
Issues = "https://github.com/ldgit99/eduagent/issues"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "pyright>=1.1.390",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edu_agent"]

# Templates live outside the package on disk for readability, but are shipped
# inside the wheel so `edu-agent` works after `pip install`.
[tool.hatch.build.targets.wheel.force-include]
"templates" = "edu_agent/_templates"

[tool.hatch.build.targets.sdist]
include = ["src/edu_agent", "templates", "examples", "tests", "docs", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "RUF001", # ambiguous unicode characters (Korean text in strings)
  "RUF002",
  "RUF003",
  "E501",   # line length handled by formatter; long Korean prompts are fine
]

[tool.ruff.lint.isort]
known-first-party = ["edu_agent"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingImports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:edu_agent.*"]
